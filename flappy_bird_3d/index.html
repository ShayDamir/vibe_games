<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b1020; font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif; }
  canvas { display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; user-select:none; -webkit-user-select:none; touch-action:manipulation; }

  .hidden { opacity:0 !important; visibility:hidden !important; transform:translate(-50%,-50%) scale(.85) !important; }

  /* ---------- score ---------- */
  #score {
    position:absolute; top:3.5vh; left:0; right:0; text-align:center;
    font-weight:800; font-size:clamp(54px, 11vh, 96px); color:#fff; line-height:1;
    text-shadow:
      3px 0 0 #27402b, -3px 0 0 #27402b, 0 3px 0 #27402b, 0 -3px 0 #27402b,
      2px 2px 0 #27402b, -2px 2px 0 #27402b, 2px -2px 0 #27402b, -2px -2px 0 #27402b,
      0 6px 14px rgba(0,0,0,.35);
    transition:opacity .3s;
  }
  #score.pop { animation:pop .28s cubic-bezier(.34,1.8,.64,1); }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.28)} 100%{transform:scale(1)} }

  /* ---------- ready / title ---------- */
  #ready {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2.2vh; transition:opacity .35s, visibility .35s;
  }
  #ready h1 {
    font-size:clamp(44px, 9vh, 84px); font-weight:800; color:#fff; letter-spacing:1px;
    text-shadow:
      4px 0 0 #2b5c33, -4px 0 0 #2b5c33, 0 4px 0 #2b5c33, 0 -4px 0 #2b5c33,
      3px 3px 0 #2b5c33, -3px 3px 0 #2b5c33, 3px -3px 0 #2b5c33, -3px -3px 0 #2b5c33,
      0 8px 18px rgba(0,0,0,.4);
    transform:rotate(-3deg);
  }
  #ready h1 span { color:#ffd94d; }
  #ready .sub { font-weight:700; font-size:clamp(15px,2.4vh,20px); color:#fff; opacity:.95;
    text-shadow:0 2px 6px rgba(0,0,0,.4); }
  .pill {
    pointer-events:none;
    background:linear-gradient(#ffdf6b,#ffb52e); color:#5c3a00; font-weight:800;
    font-size:clamp(17px,2.8vh,24px); padding:.55em 1.4em; border-radius:999px;
    box-shadow:0 5px 0 #c47f14, 0 10px 20px rgba(0,0,0,.3);
    animation:bob 1.1s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  #ready .hint { font-weight:600; font-size:clamp(12px,1.9vh,15px); color:#fff; opacity:.8;
    text-shadow:0 2px 5px rgba(0,0,0,.5); letter-spacing:.4px; }

  /* ---------- game over panel ---------- */
  #panel {
    position:absolute; left:50%; top:50%; width:min(400px, 86vw);
    transform:translate(-50%,-50%) scale(.85);
    background:linear-gradient(#fdf3d8, #f3dfae);
    border:4px solid #b98a3c; border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 3px 0 rgba(255,255,255,.8);
    padding:26px 30px 28px; text-align:center;
    transition:transform .38s cubic-bezier(.34,1.56,.64,1), opacity .3s, visibility .3s;
    opacity:0; visibility:hidden; pointer-events:none;
  }
  #panel.show { opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #panel h2 { font-size:34px; font-weight:800; color:#e2574c; letter-spacing:.5px;
    text-shadow:0 2px 0 #fff6; margin-bottom:14px; }
  .rows { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .medal {
    width:88px; height:88px; border-radius:50%; flex:0 0 auto; position:relative;
    background:radial-gradient(circle at 32% 28%, #cfd6dd 0%, #cfd6dd 35%, #8a949e 100%);
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), inset 0 5px 8px rgba(255,255,255,.6), 0 6px 14px rgba(0,0,0,.25);
    border:3px solid #6d7681; display:flex; align-items:center; justify-content:center;
  }
  .medal.none { background:radial-gradient(circle at 32% 28%, #efe7d2, #cbbd97); border-color:#a08c5f; }
  .medal.none::after { content:'—'; font-size:34px; font-weight:800; color:#8d7a4e; }
  .medal.bronze  { background:radial-gradient(circle at 32% 28%, #f2b98c 0%, #d98c4a 45%, #9c5a24 100%); border-color:#7c451a; }
  .medal.silver  { background:radial-gradient(circle at 32% 28%, #ffffff 0%, #d7dee5 45%, #93a0ad 100%); border-color:#727f8c; }
  .medal.gold    { background:radial-gradient(circle at 32% 28%, #fff3b8 0%, #ffd94d 45%, #cf9418 100%); border-color:#a8740f; }
  .medal.platinum{ background:radial-gradient(circle at 32% 28%, #ffffff 0%, #c9f2f7 45%, #6cc3d8 100%); border-color:#4395ab; }
  .medal::before {
    content:''; position:absolute; inset:10px; border-radius:50%;
    border:2px dashed rgba(255,255,255,.55);
  }
  .medal span { font-weight:800; font-size:22px; color:rgba(0,0,0,.45); }
  .medal.bronze span{color:#5e3410} .medal.silver span{color:#4c5a68}
  .medal.gold span{color:#7c5405}  .medal.platinum span{color:#2c6d82}
  .stat { flex:1; }
  .stat .lbl { font-weight:800; font-size:13px; letter-spacing:2px; color:#a5793a; }
  .stat .val { font-weight:800; font-size:40px; color:#5c451c; line-height:1.05; }
  #newBest {
    display:inline-block; margin-top:4px; background:#e2574c; color:#fff; font-weight:800;
    font-size:12px; letter-spacing:1px; padding:3px 10px; border-radius:999px;
    box-shadow:0 3px 0 #a83a31; transform:rotate(-2deg);
  }
  #panel .btns { margin-top:20px; display:flex; gap:12px; justify-content:center; }
  .btn {
    pointer-events:auto; cursor:pointer; border:none; font-family:inherit;
    font-weight:800; font-size:19px; letter-spacing:.5px; color:#fff;
    padding:12px 30px; border-radius:14px;
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .btn.green { background:linear-gradient(#8ee06a,#4db348); box-shadow:0 5px 0 #2e7d33, 0 10px 18px rgba(0,0,0,.25); }
  .btn.green:hover { filter:brightness(1.06); }
  .btn.green:active { transform:translateY(4px); box-shadow:0 1px 0 #2e7d33; }
  .btn.tan   { background:linear-gradient(#ffe9a8,#f0c465); color:#6b4a12; box-shadow:0 5px 0 #b98a3c, 0 10px 18px rgba(0,0,0,.25); }
  .btn.tan:active { transform:translateY(4px); box-shadow:0 1px 0 #b98a3c; }
  .keyhint { margin-top:14px; font-weight:700; font-size:12.5px; color:#a5793a; letter-spacing:.5px; }
  kbd {
    background:#fff; border:1px solid #cbb077; border-bottom-width:3px; border-radius:5px;
    font-family:inherit; font-weight:800; font-size:11px; color:#6b4a12; padding:1px 6px;
  }

  /* ---------- misc ---------- */
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #pause {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(20,28,40,.82); color:#fff; font-weight:800; font-size:22px;
    padding:16px 34px; border-radius:16px; backdrop-filter:blur(4px);
    opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; letter-spacing:1px;
  }
  #pause.show { opacity:1; visibility:visible; }
  #mute {
    position:absolute; top:14px; right:14px; pointer-events:auto; cursor:pointer;
    width:46px; height:46px; border-radius:50%; border:none;
    background:rgba(20,28,40,.45); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .12s;
  }
  #mute:hover { background:rgba(20,28,40,.65); }
  #mute:active { transform:scale(.92); }
  #mute svg { width:22px; height:22px; fill:#fff; }
  #mute .off { display:none; }
  #mute.muted .on { display:none; }
  #mute.muted .off { display:block; }
</style>
</head>
<body>
<div id="ui">
  <div id="score" class="hidden">0</div>

  <div id="ready">
    <h1>FLAPPY <span>BIRD</span> 3D</h1>
    <div class="sub">fly through the gates, dodge the pipes</div>
    <div class="pill">TAP / SPACE TO FLAP</div>
    <div class="hint">click · tap · space · W · &uarr;&nbsp;&nbsp;|&nbsp;&nbsp;P pause · M sound</div>
  </div>

  <div id="panel">
    <h2>GAME OVER</h2>
    <div class="rows">
      <div class="medal none" id="medal"><span id="medalTxt"></span></div>
      <div class="stat">
        <div class="lbl">SCORE</div>
        <div class="val" id="finalScore">0</div>
      </div>
      <div class="stat">
        <div class="lbl">BEST</div>
        <div class="val" id="finalBest">0</div>
        <div><span id="newBest" style="display:none">NEW!</span></div>
      </div>
    </div>
    <div class="btns">
      <button class="btn green" id="restartBtn">PLAY AGAIN</button>
    </div>
    <div class="keyhint"><kbd>R</kbd> or <kbd>SPACE</kbd> to restart</div>
  </div>

  <div id="pause">PAUSED</div>
  <div id="flash"></div>
  <button id="mute" title="Mute (M)">
    <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============================== CONSTANTS ============================== */
  const BIRD_X = -2;
  const BIRD_R = 0.45;
  const GRAVITY = -30;
  const FLAP_VY = 10.2;
  const MAX_FALL = -18;
  const BASE_SPEED = 8.5;
  const PIPE_SPACING = 8;
  const PIPE_W = 1.9, PIPE_D = 1.7, PIPE_TOP = 24;
  const CEIL = 15;
  const SPAWN_X = 112, KILL_X = -14;

  /* ============================== SOUND ============================== */
  const Sound = {
    ctx: null,
    on: localStorage.getItem('flappy3d_mute') !== '1',
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    },
    resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
    tone(f0, f1, dur, type, vol, delay) {
      if (!this.ctx || !this.on) return;
      delay = delay || 0; type = type || 'sine'; vol = vol || 0.3;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(Math.max(1, f0), t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.03);
    },
    noise(dur, vol, f0, f1, delay) {
      if (!this.ctx || !this.on) return;
      delay = delay || 0;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (this.ctx.sampleRate * dur) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t);
    },
    flap()   { this.tone(420, 780, 0.09, 'triangle', 0.22); },
    score()  { this.tone(880, 880, 0.07, 'sine', 0.28); this.tone(1318, 1318, 0.13, 'sine', 0.28, 0.07); },
    hit()    { this.noise(0.25, 0.5, 900, 120); this.tone(220, 90, 0.2, 'square', 0.25); },
    die()    { this.tone(560, 140, 0.55, 'sawtooth', 0.22, 0.18); },
    swoosh() { this.noise(0.35, 0.18, 300, 2400); },
    thud()   { this.tone(120, 50, 0.16, 'sine', 0.5); this.noise(0.12, 0.22, 300, 80); },
    click()  { this.tone(700, 520, 0.06, 'sine', 0.18); }
  };

  /* ============================== RENDERER / SCENE ============================== */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcdeeff, 32, 170);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(-1, 8, 14);

  /* ---------------- lights ---------------- */
  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6a8f5a, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d0, 1.15);
  sun.position.set(14, 26, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -22; sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 26;  sun.shadow.camera.bottom = -8;
  sun.shadow.camera.near = 5;  sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  scene.add(sun.target);
  sun.target.position.set(BIRD_X + 4, 0, 0);

  const rim = new THREE.DirectionalLight(0x9fc8ff, 0.35);
  rim.position.set(-10, 8, -14);
  scene.add(rim);

  /* ---------------- sky dome ---------------- */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(0x4fb3ff) },
      uBottom: { value: new THREE.Color(0xcdeeff) }
    },
    vertexShader: `
      varying vec3 vP;
      void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uTop; uniform vec3 uBottom; varying vec3 vP;
      void main(){
        float h = clamp(normalize(vP).y, 0.0, 1.0);
        gl_FragColor = vec4(mix(uBottom, uTop, pow(h, 0.75)), 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(340, 32, 16), skyMat);
  scene.add(sky);

  /* ---------------- sun disc ---------------- */
  function radialTex(size, stops) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [o, col] of stops) g.addColorStop(o, col);
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex(128, [[0, 'rgba(255,252,235,1)'], [0.25, 'rgba(255,244,200,0.95)'], [0.5, 'rgba(255,220,140,0.35)'], [1, 'rgba(255,220,140,0)']]),
    transparent: true, depthWrite: false, fog: false
  }));
  sunSprite.scale.setScalar(46);
  sunSprite.position.set(-60, 62, -260);
  scene.add(sunSprite);

  /* ---------------- stars (night) ---------------- */
  {
    const N = 260, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2;
      const e = Math.random() * Math.PI * 0.42 + 0.06;
      const r = 300;
      pos[i * 3] = Math.cos(a) * Math.cos(e) * r;
      pos[i * 3 + 1] = Math.sin(e) * r;
      pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r - 60;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    window.__stars = new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false
    }));
    scene.add(window.__stars);
  }

  /* ---------------- parallax mountains ---------------- */
  function mountainLayer(color, z, minH, maxH, minR, maxR, count, speedFactor, flat) {
    const grp = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: flat });
    const items = [];
    for (let i = 0; i < count; i++) {
      const h = minH + Math.random() * (maxH - minH);
      const r = minR + Math.random() * (maxR - minR);
      const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 5), mat);
      m.position.set(-80 + Math.random() * 170, h / 2 - 3, z + (Math.random() - 0.5) * 14);
      m.rotation.y = Math.random() * Math.PI;
      grp.add(m); items.push(m);
    }
    scene.add(grp);
    return { items, speedFactor, span: 170 };
  }
  const farMtn = mountainLayer(0x9fc0dd, -120, 18, 42, 22, 40, 8, 0.06, true);
  const nearMtn = mountainLayer(0x79a86d, -70, 9, 17, 14, 26, 9, 0.14, true);

  /* ---------------- clouds ---------------- */
  const cloudGroup = new THREE.Group();
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92, flatShading: true });
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Group();
    const n = 3 + (Math.random() * 3 | 0);
    for (let j = 0; j < n; j++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), cloudMat);
      s.position.set(j * 1.3 - n * 0.6, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.8);
      s.scale.set(1.4 + Math.random() * 1.2, 0.9 + Math.random() * 0.5, 1);
      c.add(s);
    }
    const sc = 1.6 + Math.random() * 2.2;
    c.scale.setScalar(sc);
    c.position.set(-70 + Math.random() * 150, 17 + Math.random() * 16, -34 - Math.random() * 26);
    cloudGroup.add(c);
    clouds.push({ g: c, f: 0.18 + Math.random() * 0.16 });
  }
  scene.add(cloudGroup);

  /* ---------------- ground ---------------- */
  function groundFrontTex() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#8a5a2b'; x.fillRect(0, 0, 256, 128);
    for (let i = 0; i < 220; i++) {
      x.fillStyle = Math.random() > 0.5 ? 'rgba(60,35,12,0.5)' : 'rgba(190,140,80,0.5)';
      x.fillRect(Math.random() * 256, 40 + Math.random() * 88, 3 + Math.random() * 5, 2 + Math.random() * 3);
    }
    x.fillStyle = '#49b04a'; x.fillRect(0, 0, 256, 38);
    x.fillStyle = '#63cf5f';
    for (let i = 0; i < 40; i++) x.fillRect(Math.random() * 256, Math.random() * 26, 4 + Math.random() * 8, 5);
    x.fillStyle = '#2f8f3a'; x.fillRect(0, 34, 256, 5);
    x.fillStyle = 'rgba(0,0,0,0.18)'; x.fillRect(0, 39, 256, 4);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(34, 1);
    t.anisotropy = 4;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function grassTopTex() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#3f9e44'; x.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 500; i++) {
      x.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,60,0,0.12)';
      x.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(34, 1.4);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const groundFront = groundFrontTex();
  const groundSlab = new THREE.Mesh(
    new THREE.BoxGeometry(160, 1.3, 4.5),
    [
      new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 1 }),
      new THREE.MeshStandardMaterial({ map: grassTopTex(), roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x7a4c24, roughness: 1 }),
      new THREE.MeshStandardMaterial({ map: groundFront, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 1 })
    ]
  );
  groundSlab.position.set(42, -0.65, 0.8);
  groundSlab.receiveShadow = true;
  scene.add(groundSlab);

  /* ---------------- pipes ---------------- */
  function pipeTex() {
    const c = document.createElement('canvas'); c.width = 128; c.height = 8;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 128, 0);
    g.addColorStop(0.00, '#0f5c26');
    g.addColorStop(0.16, '#2ea44e');
    g.addColorStop(0.40, '#8fe89c');
    g.addColorStop(0.56, '#4cc463');
    g.addColorStop(0.82, '#1d8f3c');
    g.addColorStop(1.00, '#0b4a1e');
    x.fillStyle = g; x.fillRect(0, 0, 128, 8);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const pipeMat = new THREE.MeshStandardMaterial({ map: pipeTex(), roughness: 0.5, metalness: 0.08 });
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const pipePool = [];
  const activePipes = [];
  const MAX_PAIRS = 18;
  for (let i = 0; i < MAX_PAIRS; i++) {
    const p = {
      top: new THREE.Mesh(unitBox, pipeMat),
      bot: new THREE.Mesh(unitBox, pipeMat),
      capT: new THREE.Mesh(unitBox, pipeMat),
      capB: new THREE.Mesh(unitBox, pipeMat),
      x: 0, gapY: 8, gap: 6, scored: false, active: false
    };
    [p.top, p.bot, p.capT, p.capB].forEach(m => { m.castShadow = true; m.visible = false; scene.add(m); });
    pipePool.push(p);
  }
  function setPipePair(p, x, gapY, gap) {
    p.x = x; p.gapY = gapY; p.gap = gap; p.scored = false; p.active = true;
    const gB = gapY - gap / 2, gT = gapY + gap / 2;
    p.bot.scale.set(PIPE_W, gB, PIPE_D); p.bot.position.set(x, gB / 2, 0);
    p.capB.scale.set(PIPE_W + 0.5, 0.62, PIPE_D + 0.4); p.capB.position.set(x, gB - 0.02, 0);
    const topH = PIPE_TOP - gT;
    p.top.scale.set(PIPE_W, topH, PIPE_D); p.top.position.set(x, gT + topH / 2, 0);
    p.capT.scale.set(PIPE_W + 0.5, 0.62, PIPE_D + 0.4); p.capT.position.set(x, gT + 0.02, 0);
    [p.top, p.bot, p.capT, p.capB].forEach(m => m.visible = true);
    activePipes.push(p);
  }
  function clearPipes() {
    for (const p of activePipes) { p.active = false; [p.top, p.bot, p.capT, p.capB].forEach(m => m.visible = false); }
    activePipes.length = 0;
  }
  const randGapY = (gap) => {
    const lo = gap / 2 + 1.1, hi = 12.2 - gap / 2;
    return lo + Math.random() * (hi - lo);
  };

  /* ---------------- bird ---------------- */
  const bird = new THREE.Group();
  {
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffd23e, roughness: 0.5, metalness: 0.05 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), bodyMat);
    body.scale.set(1.18, 1, 0.95);
    bird.add(body);

    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xfff3cf, roughness: 0.75 }));
    belly.scale.set(0.92, 0.72, 0.78);
    belly.position.set(0.1, -0.17, 0);
    bird.add(belly);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
    const pupMat = new THREE.MeshStandardMaterial({ color: 0x1c1c24, roughness: 0.3 });
    for (const s of [1, -1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 16), eyeMat);
      eye.position.set(0.24, 0.2, 0.3 * s);
      bird.add(eye);
      const pup = new THREE.Mesh(new THREE.SphereGeometry(0.08, 14, 12), pupMat);
      pup.position.set(0.33, 0.22, 0.36 * s);
      bird.add(pup);
    }

    const beakMat = new THREE.MeshStandardMaterial({ color: 0xff8c2e, roughness: 0.45 });
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.46, 14), beakMat);
    beak.rotation.z = -Math.PI / 2;
    beak.scale.set(1, 1, 0.72);
    beak.position.set(0.66, 0.02, 0);
    bird.add(beak);

    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.4, 10), bodyMat);
    tail.rotation.z = Math.PI / 2;
    tail.scale.set(1, 1, 0.55);
    tail.position.set(-0.62, 0.12, 0);
    bird.add(tail);

    const wingMat = new THREE.MeshStandardMaterial({ color: 0xfff6e0, roughness: 0.6 });
    window.__wingPivots = [];
    for (const s of [1, -1]) {
      const pivot = new THREE.Group();
      pivot.position.set(-0.04, 0.06, 0.34 * s);
      const wing = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 14), wingMat);
      wing.scale.set(1.05, 0.6, 0.22);
      wing.position.set(-0.14, 0, 0.1 * s);
      pivot.add(wing);
      pivot.rotation.x = 0.12;
      bird.add(pivot);
      window.__wingPivots.push(pivot);
    }
    bird.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  }
  bird.position.set(BIRD_X, 6, 0);
  scene.add(bird);

  /* ---------------- particles ---------------- */
  const softTex = radialTex(64, [[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.8)'], [1, 'rgba(255,255,255,0)']]);
  const partPool = [];
  for (let i = 0; i < 56; i++) {
    const m = new THREE.SpriteMaterial({ map: softTex, transparent: true, opacity: 0, depthWrite: false });
    const s = new THREE.Sprite(m);
    s.visible = false; s.renderOrder = 10;
    scene.add(s);
    partPool.push({ s, vel: new THREE.Vector3(), life: 0, max: 1, size: 0.3, grav: 0, col: new THREE.Color(1, 1, 1), rot: 0, rotV: 0 });
  }
  function spawnPart(pos, vel, life, size, col, grav) {
    const p = partPool.find(q => !q.s.visible);
    if (!p) return;
    p.s.visible = true;
    p.s.position.copy(pos);
    p.vel.copy(vel);
    p.life = p.max = life;
    p.size = size; p.grav = grav;
    p.col.copy(col);
    p.rot = Math.random() * Math.PI * 2;
    p.rotV = (Math.random() - 0.5) * 10;
  }
  const _c1 = new THREE.Color();
  function updateParts(dt) {
    for (const p of partPool) {
      if (!p.s.visible) continue;
      p.life -= dt;
      if (p.life <= 0) { p.s.visible = false; continue; }
      p.vel.y -= p.grav * dt;
      p.s.position.addScaledVector(p.vel, dt);
      const k = p.life / p.max;
      p.s.material.opacity = Math.min(1, k * 1.6);
      p.s.material.color.copy(p.col);
      p.s.material.rotation += p.rotV * dt;
      p.s.scale.setScalar(p.size * (0.55 + 0.45 * k));
    }
  }
  function spawnFlapParts() {
    for (let i = 0; i < 3; i++) {
      _c1.setHSL(0.13, 0.8, 0.85 + Math.random() * 0.1);
      spawnPart(
        bird.position.clone().add(new THREE.Vector3(-0.6, -0.25 + (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.5)),
        new THREE.Vector3(-2.5 - Math.random() * 2, -1 - Math.random(), (Math.random() - 0.5) * 1.5),
        0.45, 0.3, _c1, 2
      );
    }
  }
  function spawnFeathers() {
    for (let i = 0; i < 16; i++) {
      _c1.setHSL(Math.random() > 0.4 ? 0.13 : 0.1, 0.7 + Math.random() * 0.3, 0.75 + Math.random() * 0.2);
      spawnPart(
        bird.position.clone(),
        new THREE.Vector3((Math.random() - 0.7) * 7, (Math.random() - 0.2) * 7, (Math.random() - 0.5) * 6),
        1.1 + Math.random() * 0.5, 0.34 + Math.random() * 0.2, _c1, 13
      );
    }
  }
  function spawnDust() {
    for (let i = 0; i < 8; i++) {
      _c1.setHSL(0.09, 0.35, 0.6);
      spawnPart(
        bird.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 1.6, 0.1, (Math.random() - 0.5) * 0.8)),
        new THREE.Vector3((Math.random() - 0.5) * 5, 1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 2),
        0.55, 0.4, _c1, 9
      );
    }
  }

  /* ---------------- day / dusk / night palettes ---------------- */
  const PAL = {
    day:   { top: new THREE.Color(0x4fb3ff), bot: new THREE.Color(0xcdeeff), sun: new THREE.Color(0xfff6d8), hemi: new THREE.Color(0xbfe3ff) },
    dusk:  { top: new THREE.Color(0x5a4fae), bot: new THREE.Color(0xffa86b), sun: new THREE.Color(0xff8e4a), hemi: new THREE.Color(0xffc9a0) },
    night: { top: new THREE.Color(0x0a1030), bot: new THREE.Color(0x2a3f77), sun: new THREE.Color(0xdfe8ff), hemi: new THREE.Color(0x33406b) }
  };
  const _cA = new THREE.Color(), _cB = new THREE.Color();
  function lerpPal(out, a, b, t) {
    out.top.copy(a.top).lerp(b.top, t);
    out.bot.copy(a.bot).lerp(b.bot, t);
    out.sun.copy(a.sun).lerp(b.sun, t);
    out.hemi.copy(a.hemi).lerp(b.hemi, t);
  }
  const dayT = { top: new THREE.Color(), bot: new THREE.Color(), sun: new THREE.Color(), hemi: new THREE.Color() };
  function applySky(score) {
    const t = Math.min(score / 28, 1);
    if (t < 0.55) lerpPal(dayT, PAL.day, PAL.dusk, t / 0.55);
    else lerpPal(dayT, PAL.dusk, PAL.night, (t - 0.55) / 0.45);
    skyMat.uniforms.uTop.value.copy(dayT.top);
    skyMat.uniforms.uBottom.value.copy(dayT.bot);
    scene.fog.color.copy(dayT.bot);
    sunSprite.material.color.copy(dayT.sun);
    hemi.color.copy(dayT.hemi);
    window.__stars.material.opacity = Math.max(0, (t - 0.62) / 0.38) * 0.9;
  }

  /* ============================== GAME STATE ============================== */
  let state = 'menu';          // menu | play | dead | over
  let score = 0, best = parseInt(localStorage.getItem('flappy3d_best') || '0', 10);
  let speed = BASE_SPEED;
  let vy = 0, rot = 0, wingAnim = 0;
  let deadT = 0, landed = false, panelShown = false, overTime = 0;
  let shake = 0;
  let paused = false;
  let elapsed = 0;

  const elScore = document.getElementById('score');
  const elReady = document.getElementById('ready');
  const elPanel = document.getElementById('panel');
  const elFinal = document.getElementById('finalScore');
  const elBest = document.getElementById('finalBest');
  const elNew = document.getElementById('newBest');
  const elMedal = document.getElementById('medal');
  const elMedalTxt = document.getElementById('medalTxt');
  const elFlash = document.getElementById('flash');
  const elPause = document.getElementById('pause');
  const elMute = document.getElementById('mute');

  function flash() {
    elFlash.style.transition = 'none';
    elFlash.style.opacity = 0.85;
    requestAnimationFrame(() => {
      elFlash.style.transition = 'opacity .5s';
      elFlash.style.opacity = 0;
    });
  }
  function setScoreUI() { elScore.textContent = score; }
  function popScore() {
    elScore.classList.remove('pop');
    void elScore.offsetWidth;
    elScore.classList.add('pop');
  }
  function medalFor(s) {
    if (s >= 40) return ['platinum', '40+'];
    if (s >= 30) return ['gold', '30'];
    if (s >= 20) return ['silver', '20'];
    if (s >= 10) return ['bronze', '10'];
    return ['none', ''];
  }
  function showPanel() {
    const isNew = score > best;
    if (isNew) { best = score; localStorage.setItem('flappy3d_best', String(best)); }
    elFinal.textContent = score;
    elBest.textContent = best;
    elNew.style.display = isNew && score > 0 ? 'inline-block' : 'none';
    const [cls, txt] = medalFor(score);
    elMedal.className = 'medal ' + cls;
    elMedalTxt.textContent = txt;
    elPanel.classList.add('show');
  }
  function hidePanel() { elPanel.classList.remove('show'); }

  function resetWorld() {
    clearPipes();
    score = 0; speed = BASE_SPEED;
    vy = FLAP_VY; rot = 0; wingAnim = 1;
    bird.position.set(BIRD_X, 6, 0);
    bird.rotation.set(0, 0, 0);
    landed = false; panelShown = false; deadT = 0; shake = 0;
    setScoreUI();
    applySky(0);
  }
  function startGame() {
    Sound.swoosh();
    resetWorld();
    state = 'play';
    elReady.classList.add('hidden');
    hidePanel();
    elScore.classList.remove('hidden');
    spawnFlapParts();
    Sound.flap();
  }
  function flap() {
    vy = FLAP_VY;
    wingAnim = 1;
    Sound.flap();
    spawnFlapParts();
  }
  function die(onGround) {
    if (state !== 'play') return;
    state = 'dead';
    deadT = 0; landed = !!onGround;
    Sound.hit();
    if (!onGround) Sound.die();
    shake = 1;
    flash();
    spawnFeathers();
    if (onGround) { vy = 0; }
    else { vy = Math.max(vy, 0) + 5; }
  }

  /* ---------------- update ---------------- */
  const _look = new THREE.Vector3();
  function update(dt) {
    elapsed += dt;

    /* -- world scroll speed -- */
    const worldSpeed = (state === 'menu') ? BASE_SPEED * 0.55 : (state === 'play' ? speed : 0);

    /* -- mountains / clouds -- */
    for (const L of [farMtn, nearMtn]) {
      for (const m of L.items) {
        m.position.x -= worldSpeed * L.speedFactor * dt;
        if (m.position.x < -85) m.position.x += L.span;
      }
    }
    for (const c of clouds) {
      c.g.position.x -= worldSpeed * c.f * dt;
      if (c.g.position.x < -75) {
        c.g.position.x += 150;
        c.g.position.y = 17 + Math.random() * 16;
      }
    }

    /* -- ground texture scroll -- */
    if (worldSpeed > 0) {
      groundFront.offset.x += worldSpeed * dt / (160 / 34);
      groundSlab.material[2].map.offset.x += worldSpeed * dt / (160 / 34);
    }

    /* -- pipes -- */
    if (state === 'play') {
      speed = BASE_SPEED + Math.min(score * 0.12, 5);
      const gap = Math.max(5.2, 6.5 - score * 0.035);

      for (let i = activePipes.length - 1; i >= 0; i--) {
        const p = activePipes[i];
        p.x -= speed * dt;
        p.bot.position.x = p.capB.position.x = p.x;
        p.top.position.x = p.capT.position.x = p.x;
        if (!p.scored && p.x < BIRD_X) {
          p.scored = true;
          score++;
          setScoreUI();
          popScore();
          Sound.score();
          applySky(score);
        }
        if (p.x < KILL_X) {
          p.active = false;
          [p.top, p.bot, p.capT, p.capB].forEach(m => m.visible = false);
          activePipes.splice(i, 1);
        }
      }
      let maxX = -Infinity;
      for (const p of activePipes) maxX = Math.max(maxX, p.x);
      if (activePipes.length === 0) setPipePair(pipePool[0], 24, randGapY(6.5), 6.5);
      else if (maxX < SPAWN_X) {
        const free = pipePool.find(p => !p.active);
        if (free) setPipePair(free, maxX + PIPE_SPACING, randGapY(gap), gap);
      }

      /* -- bird physics -- */
      vy = Math.max(vy + GRAVITY * dt, MAX_FALL);
      bird.position.y += vy * dt;

      if (bird.position.y > CEIL) { bird.position.y = CEIL; vy = Math.min(vy, 0); }
      if (bird.position.y <= BIRD_R) {
        bird.position.y = BIRD_R;
        die(true);
      } else {
        for (const p of activePipes) {
          if (Math.abs(p.x - BIRD_X) < PIPE_W / 2 + BIRD_R) {
            const gB = p.gapY - p.gap / 2, gT = p.gapY + p.gap / 2;
            if (bird.position.y - BIRD_R < gB || bird.position.y + BIRD_R > gT) { die(false); break; }
          }
        }
      }
      if (state === 'play') {
        const target = THREE.MathUtils.clamp(vy * 0.055, -1.0, 0.55);
        rot += (target - rot) * Math.min(1, dt * 11);
      }
    }

    if (state === 'dead') {
      deadT += dt;
      if (!landed) {
        vy += GRAVITY * dt * 1.05;
        bird.position.y += vy * dt;
        rot += (-1.65 - rot) * Math.min(1, dt * 6);
        if (bird.position.y <= BIRD_R) {
          bird.position.y = BIRD_R;
          landed = true;
          shake = 0.5;
          Sound.thud();
          spawnDust();
        }
      } else if (deadT > 0.9 && !panelShown) {
        panelShown = true;
        state = 'over';
        overTime = performance.now();
        showPanel();
      }
    }

    if (state === 'menu') {
      bird.position.y = 5.6 + Math.sin(elapsed * 2.4) * 0.35;
      rot = Math.sin(elapsed * 2.4 + 1.2) * 0.12;
      vy = 0;
    }

    if (state === 'over') {
      bird.rotation.z = rot;
    }

    /* -- bird visual -- */
    bird.position.x = BIRD_X;
    bird.rotation.z = rot;
    bird.rotation.y = Math.sin(elapsed * 1.7) * 0.03;
    wingAnim = Math.max(0, wingAnim - dt * 3.6);
    const wAngle = 0.12 - 1.15 * Math.sin(wingAnim * Math.PI) + Math.sin(elapsed * 5) * 0.05;
    for (const pv of window.__wingPivots) pv.rotation.x = wAngle;

    /* -- particles -- */
    updateParts(dt);

    /* -- camera -- */
    shake = Math.max(0, shake - dt * 2.4);
    const by = bird.position.y;
    const camY = (state === 'menu' ? 5.6 : THREE.MathUtils.clamp(by, 1.5, 13)) * 0.42 + 4.4;
    camera.position.x += ((-1.2) - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y += (camY - camera.position.y) * Math.min(1, dt * 4.5);
    camera.position.z = 14;
    _look.set(3.2, 2.6 + by * 0.5, 0);
    camera.lookAt(_look);
    if (shake > 0) {
      camera.position.x += (Math.random() - 0.5) * shake * 0.55;
      camera.position.y += (Math.random() - 0.5) * shake * 0.55;
    }
    sky.position.copy(camera.position);
  }

  /* ============================== INPUT ============================== */
  function onAction() {
    Sound.init(); Sound.resume();
    if (paused) { togglePause(); return; }
    if (state === 'menu') { startGame(); return; }
    if (state === 'play') { flap(); return; }
    if (state === 'over' && performance.now() - overTime > 550) { startGame(); }
  }
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    onAction();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) onAction();
    } else if (e.code === 'KeyM') {
      toggleMute();
    } else if (e.code === 'KeyP') {
      togglePause();
    } else if (e.code === 'KeyR') {
      if (state === 'over' || state === 'dead') startGame();
    }
  });

  const restartBtn = document.getElementById('restartBtn');
  restartBtn.addEventListener('click', () => { Sound.init(); Sound.resume(); Sound.click(); startGame(); });

  function togglePause() {
    if (state !== 'play') return;
    paused = !paused;
    elPause.classList.toggle('show', paused);
    Sound.click();
  }
  function toggleMute() {
    Sound.on = !Sound.on;
    localStorage.setItem('flappy3d_mute', Sound.on ? '0' : '1');
    elMute.classList.toggle('muted', !Sound.on);
    if (Sound.on) { Sound.init(); Sound.click(); }
  }
  elMute.classList.toggle('muted', !Sound.on);
  elMute.addEventListener('click', (e) => { e.stopPropagation(); Sound.init(); toggleMute(); });

  window.addEventListener('blur', () => { if (state === 'play' && !paused) togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !paused) togglePause(); });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ============================== LOOP ============================== */
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) update(dt);
    renderer.render(scene, camera);
  }
  applySky(0);
  setScoreUI();
  loop();
})();
</script>
</body>
</html>
